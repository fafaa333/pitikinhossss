<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitikinhos - Novo Pedido</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="background">
    <div class="paw paw-top-left"></div>
    <div class="paw paw-top-right"></div>
    <div class="paw paw-bottom-left"></div>
    <div class="paw paw-bottom-right"></div>
</div>

<main class="container">

<header class="topbar">

    <div class="logo-area">
        <img src="img/logo.png" class="logo" alt="Logo">
        <div>
            <h1>Novo Orçamento</h1>
            <p>Sistema Pitikinhos</p>
        </div>
    </div>

    <div class="pedido-info">
        <span>Pedido Nº</span>
        <strong id="numeroPedido">26.07.001</strong>
    </div>

</header>

<div class="progress">
    <div class="progress-fill" style="width:33%;"></div>
</div>

<div class="steps">
    <button class="step active">👤 Cliente</button>
    <button class="step">📦 Produtos</button>
    <button class="step">📄 PDF</button>
</div>

<!-- ETAPA 1 -->
<section id="etapa1" class="card">

<h2>Dados do Cliente</h2>

<div class="form-grid">

<div class="input-group">
<label>Nome do Cliente</label>
<input type="text" id="cliente">
</div>

<div class="input-group">
<label>CNPJ</label>
<input type="text" id="cnpj">
</div>

<div class="input-group">
<label>Telefone</label>
<input type="text" id="telefone">
</div>

<div class="input-group">
<label>Instagram</label>
<input type="text" id="instagram">
</div>

<div class="input-group full">
<label>Endereço</label>
<input type="text" id="endereco">
</div>

<div class="input-group">
<label>Cidade</label>
<input type="text" id="cidade">
</div>

<div class="input-group">
<label>Estado</label>
<input type="text" id="estado">
</div>

<div class="input-group full">
<label>Observações</label>
<textarea id="observacao" rows="4"></textarea>
</div>

</div>

<div class="buttons">
<button class="btn-next" onclick="proximaEtapa()">
Próximo →
</button>
</div>

</section>

<!-- ETAPA 2 -->
<section id="etapa2" class="card" style="display:none;">

<h2>Produtos</h2>

<div class="form-grid">

<div class="input-group">
<label>Produto</label>
<input id="produto" type="text">
</div>

<div class="input-group">
<label>Categoria</label>
<input id="categoria" type="text">
</div>

<div class="input-group">
<label>Tamanho</label>
<input id="tamanho" type="text">
</div>

<div class="input-group">
<label>Quantidade</label>
<input id="quantidade" type="number">
</div>

<div class="input-group">
<label>Valor Unitário</label>
<input id="valor" type="number" step="0.01">
</div>

<div class="input-group full">
<label>Observação</label>
<textarea id="obsProduto"></textarea>
</div>

</div>

<button onclick="adicionarProduto()">+ Adicionar Produto</button>

<br><br>

<table width="100%" border="0">
<thead>
<tr>
<th>Produto</th>
<th>Qtd.</th>
<th>Valor</th>
<th>Subtotal</th>
<th></th>
</tr>
</thead>
<tbody id="listaProdutos"></tbody>
</table>

<h3>Total: <span id="totalPedido">R$ 0,00</span></h3>

<div class="buttons">
<button onclick="etapaAnterior()">← Voltar</button>
<button class="btn-next" onclick="proximaEtapa()">Próximo →</button>
</div>

</section>

<!-- ETAPA 3 -->
<section id="etapa3" class="card" style="display:none;">

<h2>Resumo do Pedido</h2>

<p>Aqui serão exibidos os dados preenchidos antes da geração do PDF.</p>

<div id="resumoPedido">

<p><strong>Cliente:</strong> <span id="resumoCliente">-</span></p>

<p><strong>Total:</strong> <span id="resumoTotal">R$ 0,00</span></p>

</div>

<div class="buttons">

<button onclick="etapaAnterior()">← Voltar</button>

<button class="btn-next" onclick="gerarPDF()">
    <i class="fa-solid fa-file-pdf"></i> Gerar PDF
</button>

</div>

</section>

</main>

<<!-- Biblioteca jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Biblioteca AutoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Seu JavaScript -->
<script src="app.js"></script>

</body>
</html>
